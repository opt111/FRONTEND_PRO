<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ДЗ 20.1 — TODO з jQuery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5"><section class="card shadow-sm mx-auto todo-card"><div class="card-body p-4">
      <h1 class="h3 text-center mb-4">Мій TODO list</h1>
      <form id="todo-form" class="input-group mb-3"><input id="todo-input" class="form-control" placeholder="Нове завдання" aria-label="Нове завдання" /><button class="btn btn-primary" type="submit">Додати</button></form>
      <div id="error" class="text-danger small mb-2" role="alert"></div>
      <ul id="todo-list" class="list-group"></ul>
    </div></section></main>
    <div class="modal fade" id="todoModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="modalTitle">Ваше завдання</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button></div><div class="modal-body" id="modalText"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button></div></div></div></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="homework20.1.js"></script>
  </body>
</html>
